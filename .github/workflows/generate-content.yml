name: Generate Content

on:
  schedule:
    # Every Monday at 10:00 UTC (5:00 AM ET)
    - cron: '0 10 * * 1'
  workflow_dispatch: # Manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Generate content
        run: npx tsx scripts/generate-content.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add content/
          if git diff --staged --quiet; then
            echo "No new content generated"
          else
            git commit -m "chore(content): auto-generate weekly article

            Generated by GitHub Actions content bot"
            git push
          fi
